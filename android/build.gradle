plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.accessorysetup'
version = '0.1.0'

android {
  namespace "expo.modules.accessorysetup"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // IntentSenderRequest and StartIntentSenderForResult, for launching the association dialog
  // through Expo's activity result registry. React Native already brings this in at runtime.
  implementation "androidx.activity:activity:1.8.0"
}
